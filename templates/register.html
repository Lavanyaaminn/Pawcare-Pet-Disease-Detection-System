<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – PawCare</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">

  <!-- ============================================================
       AUTH PAGE – Registration Form
       ============================================================ -->
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo & heading -->
      <div class="auth-header">
        <a href="{{ url_for('index') }}" class="auth-logo">🐾 PawCare</a>
        <h1>Create Account</h1>
        <p>Join PawCare and start caring for your pets today.</p>
      </div>

      <!-- Flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <!-- Client-side validation error box (hidden by default) -->
      <div class="alert alert-error" id="clientError" style="display: none;"></div>

      <!-- Registration form -->
      <form method="POST" action="{{ url_for('register') }}" id="registerForm" novalidate>

        <div class="form-group">
          <label for="full_name">Full Name</label>
          <input
            type="text"
            id="full_name"
            name="full_name"
            placeholder="Enter your full name"
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password (min. 6 characters)"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Re-enter your password"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-full">Create Account</button>
      </form>

      <!-- Link to login -->
      <p class="auth-footer-text">
        Already have an account?
        <a href="{{ url_for('login') }}">Log in here</a>
      </p>

    </div>
  </div>

  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  <script>
    // Attach client-side validation to the register form
    document.getElementById("registerForm").addEventListener("submit", validateRegister);
  </script>

</body>
</html>
