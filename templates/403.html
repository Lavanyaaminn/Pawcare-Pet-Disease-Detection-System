<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 - Access Denied – PawCare</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="dashboard" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;">
    <div class="auth-card" style="text-align: center; max-width: 500px; width: 100%; box-shadow: var(--shadow-soft);">
      <span style="font-size: 5.5rem; display: block; margin-bottom: 1rem; text-shadow: 0 4px 12px rgba(220, 53, 69, 0.15);">🔒</span>
      <h1 style="color: #dc3545; font-size: 2.2rem; font-weight: 700; margin-bottom: 1rem; font-family: var(--font-heading);">403 - Access Denied</h1>
      <p style="color: var(--text-light); margin-bottom: 2rem; font-size: 1.05rem; line-height: 1.6;">
        Oops! You do not have permission to view this resource. For safety and privacy, clients can only inspect records belonging to their own pets.
      </p>
      
      <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary" style="text-decoration: none; padding: 0.75rem 1.8rem; background: linear-gradient(135deg, var(--primary-pink), var(--dark-pink)); box-shadow: 0 4px 16px rgba(255, 105, 180, 0.35);">Return to Dashboard</a>
      </div>
    </div>
  </main>
</body>
</html>
